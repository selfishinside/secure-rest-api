name: Security CI

on:
  push:
  pull_request:

jobs:
  build-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and tests
        run: ./mvnw -B clean verify

      - name: SAST SpotBugs
        run: >
          ./mvnw -B
          com.github.spotbugs:spotbugs-maven-plugin:4.8.6.0:spotbugs

      - name: SCA Dependency Check
        run: >
          ./mvnw -B
          org.owasp:dependency-check-maven:12.1.0:check
          -DfailBuildOnCVSS=11
